<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Bookings — MYSHELTER</title>
  <meta name="description" content="View and manage your MYSHELTER hotel bookings.">
  <meta name="theme-color" content="#e8e0d8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="bookings">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header wrap">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="index.html" aria-label="MYSHELTER home">
        <span class="brand-text">MYSHELTER</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Rooms</a>
        <a class="nav-link" href="bookings.html" aria-current="page"><span><span class="label-long">My </span>Bookings</span><span class="badge" data-booking-count hidden>0</span></a>
      </div>
    </nav>
  </header>

  <main id="main">
    <div class="page-head wrap">
      <p class="crumbs"><a href="index.html">Rooms</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span aria-current="page">My bookings</span></p>
      <h1>My Bookings</h1>
      <p id="bookings-summary" aria-live="polite"></p>
    </div>

    <section class="bookings wrap" id="bookings" aria-label="Bookings"></section>
  </main>

  <dialog class="sheet" id="cancel-dialog" aria-labelledby="cancel-title" aria-describedby="cancel-text">
    <form class="sheet-body" method="dialog">
      <span class="orb orb--warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg></span>
      <h2 id="cancel-title">Cancel this booking?</h2>
      <p id="cancel-text">The room will be released.</p>
      <div class="sheet-actions">
        <button class="btn btn--white" value="keep" type="submit" autofocus>Keep it</button>
        <button class="btn btn--olive" value="cancel" type="submit">Yes, cancel</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer wrap">
    <div class="footer-inner">
      <span>© <span data-year>2026</span> MYSHELTER</span>
      <span class="footer-note">Demo project. Tariffs are indicative and photos are representative.</span>
      <nav aria-label="Footer">
        <a href="index.html">Rooms</a>
        <a href="bookings.html">My bookings</a>
      </nav>
    </div>
  </footer>

  <noscript><div class="wrap"><p class="notice">MYSHELTER needs JavaScript enabled to show your bookings.</p></div></noscript>

  <script src="js/data.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/bookings.js" defer></script>
</body>
</html>
