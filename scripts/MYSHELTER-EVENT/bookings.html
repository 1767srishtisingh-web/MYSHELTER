<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Bookings — MYSHELTER</title>
  <meta name="description" content="View and manage your MYSHELTER bookings.">
  <meta name="theme-color" content="#ece6df">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="bookings">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="site-header wrap">
    <nav class="nav glass glow" aria-label="Main">
      <a class="brand" href="index.html" aria-label="MYSHELTER home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><defs><linearGradient id="bm1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ad98fb"/><stop offset="1" stop-color="#6b4cec"/></linearGradient><linearGradient id="bm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8ecdf"/><stop offset="1" stop-color="#56c7b1"/></linearGradient></defs><path d="M5 15.5 16 6l11 9.5V26a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="url(#bm1)"/><path d="M12.5 28v-7a3.5 3.5 0 0 1 7 0v7z" fill="url(#bm2)"/></svg>
        </span>
        <span>MYSHELTER<small>Hotel rooms · Delhi NCR</small></span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">Rooms</a>
        <a class="nav-link" href="bookings.html" aria-current="page"><span><span class="label-long">My </span>Bookings</span><span class="badge" data-booking-count hidden>0</span></a>
      </div>
    </nav>
  </header>

  <main id="main">
    <div class="page-head wrap">
      <p class="crumbs"><a href="index.html">Rooms</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span aria-current="page">My bookings</span></p>
      <h1>My bookings</h1>
      <p id="bookings-summary" aria-live="polite"></p>
    </div>

    <section class="bookings wrap" id="bookings" aria-label="Bookings"></section>
  </main>

  <dialog class="sheet" id="cancel-dialog" aria-labelledby="cancel-title" aria-describedby="cancel-text">
    <form class="sheet-body" method="dialog">
      <span class="orb orb--warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg></span>
      <h2 id="cancel-title">Cancel this booking?</h2>
      <p id="cancel-text">The room will be released.</p>
      <div class="sheet-actions">
        <button class="btn btn--white" value="keep" type="submit" autofocus>Keep it</button>
        <button class="btn btn--violet" value="cancel" type="submit">Yes, cancel</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer wrap">
    <div class="footer-inner glass">
      <span>© <span data-year>2026</span> MYSHELTER</span>
      <span class="footer-note">Demo project. Tariffs are indicative and photos are representative.</span>
      <nav aria-label="Footer">
        <a href="index.html">Rooms</a>
        <a href="bookings.html">My bookings</a>
      </nav>
    </div>
  </footer>

  <noscript><div class="wrap"><p class="notice">MYSHELTER needs JavaScript enabled to show your bookings.</p></div></noscript>

  <script src="js/data.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/bookings.js" defer></script>
</body>
</html>
